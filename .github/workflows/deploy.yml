name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch photo and logo assets
        run: bash scripts/fetch-images.sh

      - name: Grade photos and normalise logos
        run: |
          pip install pillow
          python3 scripts/enhance-images.py

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --base=./

      - name: Publish dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
